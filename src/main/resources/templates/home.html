<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art vs Art</title>
</head>
<body>
<main>
    <h1>Art vs Art</h1>
    <p>A daily head-to-head art discovery game.</p>

    <section>
        <h2 th:text="|Round ${matchup.roundNumber} of ${matchup.dailyGame.totalRounds}|">
            Round
        </h2>

        <p th:text="|Game for ${matchup.dailyGame.gameDate}|">
            Game date
        </p>

        <p th:if="${voted}">
            Your vote has been recorded.
        </p>

        <article>
            <img
                    th:src="${matchup.artworkOne.imageUrl}"
                    th:alt="|${matchup.artworkOne.title} by ${matchup.artworkOne.artistName}|"
                    width="500"
            >

            <h3 th:text="${matchup.artworkOne.title}">
                First artwork
            </h3>

            <p>
                    <span th:text="${matchup.artworkOne.artistName}">
                        Artist
                    </span>,
                <span th:text="${matchup.artworkOne.dateDisplay}">
                        Date
                    </span>
            </p>

            <form method="post" action="/vote">
                <input
                        type="hidden"
                        name="matchupId"
                        th:value="${matchup.id}"
                >
                <input
                        type="hidden"
                        name="artworkId"
                        th:value="${matchup.artworkOne.id}"
                >
                <button type="submit">
                    Choose this artwork
                </button>
            </form>
        </article>

        <article>
            <img
                    th:src="${matchup.artworkTwo.imageUrl}"
                    th:alt="|${matchup.artworkTwo.title} by ${matchup.artworkTwo.artistName}|"
                    width="500"
            >

            <h3 th:text="${matchup.artworkTwo.title}">
                Second artwork
            </h3>

            <p>
                    <span th:text="${matchup.artworkTwo.artistName}">
                        Artist
                    </span>,
                <span th:text="${matchup.artworkTwo.dateDisplay}">
                        Date
                    </span>
            </p>

            <form method="post" action="/vote">
                <input
                        type="hidden"
                        name="matchupId"
                        th:value="${matchup.id}"
                >
                <input
                        type="hidden"
                        name="artworkId"
                        th:value="${matchup.artworkTwo.id}"
                >
                <button type="submit">
                    Choose this artwork
                </button>
            </form>
        </article>
    </section>
</main>
</body>
</html>
