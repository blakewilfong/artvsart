<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="eventReveal" class="event-reveal"
       th:if="${answered and question.historicalEvent != null}"
       th:with="event=${question.historicalEvent}"
       aria-label="About this historical event">
    <p th:if="${event.summary != null}" th:text="${event.summary}"></p>
    <div class="event-reveal__actions">
        <a th:href="${event.wikipediaUrl}" target="_blank" rel="noopener noreferrer"
           data-event-link>Read about this event on Wikipedia (new tab)</a>
        <button type="button" data-auto-advance-control aria-pressed="false" hidden>
            Pause auto-advance
        </button>
        <span data-auto-advance-status role="status" aria-live="polite"></span>
    </div>
</aside>
</body>
</html>
