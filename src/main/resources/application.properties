spring.application.name=Art vs Art

spring.datasource.url=jdbc:h2:file:./data/artvsart-curated
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

artvsart.game.artwork-sources=met,nga,cma
artvsart.game.time-zone=America/Chicago
artvsart.import.met.target-size=700

artvsart.import.met.enabled=true
artvsart.import.met.refresh-metadata=false
artvsart.import.met.request-delay-milliseconds=1000

# NGA publishes open-data CSV tables rather than a live object API. The import
# joins its current CC0 image, object, artist, theme, and style datasets.
artvsart.import.nga.enabled=true
artvsart.import.nga.target-size=700
artvsart.import.nga.objects-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/objects.csv
artvsart.import.nga.constituents-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/constituents.csv
artvsart.import.nga.object-constituents-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/objects_constituents.csv
artvsart.import.nga.images-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/published_images.csv
artvsart.import.nga.terms-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/objects_terms.csv

# CMA provides a keyless JSON API with explicit CC0 image records. Favor the
# newest eligible paintings, then reach farther back only to balance its share.
artvsart.import.cma.enabled=true
artvsart.import.cma.target-size=600
artvsart.import.cma.created-after=1750
artvsart.import.cma.max-per-artist=5
