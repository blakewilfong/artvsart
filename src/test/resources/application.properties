spring.datasource.url=jdbc:h2:mem:artvsart-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

artvsart.game.artwork-source=met
artvsart.game.time-zone=America/Chicago
artvsart.import.met.enabled=false

artvsart.import.nga.enabled=false
artvsart.import.nga.target-size=500
artvsart.import.nga.objects-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/objects.csv
artvsart.import.nga.constituents-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/constituents.csv
artvsart.import.nga.object-constituents-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/objects_constituents.csv
artvsart.import.nga.images-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/published_images.csv
artvsart.import.nga.terms-url=https://raw.githubusercontent.com/NationalGalleryOfArt/opendata/main/data/objects_terms.csv

artvsart.import.cma.enabled=false
artvsart.import.smithsonian.enabled=false
